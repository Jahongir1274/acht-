<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acht</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body{ display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; border-bottom:1px solid var(--border);
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    flex:0 0 auto; position:relative; z-index:2;
  }
  header .right{display:flex; align-items:center; gap:10px;}
  .who{font-size:13px; color:var(--muted);}

  /* --- Papka/PDF tanlash ekrani --- */
  #pickerScreen{ flex:1; overflow-y:auto; padding:30px; position:relative; z-index:1; }
  .picker-wrap{max-width:820px; margin:0 auto;}
  .crumbs{display:flex; align-items:center; gap:8px; margin-bottom:18px; font-size:13.5px; color:var(--muted);}
  .crumbs .back{cursor:pointer; color:#d68bff; font-weight:600;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px;}
  .pick-card{
    padding:22px 18px; text-align:center; cursor:pointer;
    transition:border-color .15s, transform .1s, box-shadow .15s;
  }
  .pick-card:hover{border-color:var(--border-accent); transform:translateY(-2px); box-shadow:0 0 22px -6px var(--glow);}
  .pick-card .icon{font-size:34px; margin-bottom:10px;}
  .pick-card .label{font-weight:600; font-size:14px; color:#fff;}

  /* --- Ish maydoni (workspace) --- */
  #workspace{ display:none; flex:1; flex-direction:column; overflow:hidden; position:relative; z-index:1; }
  .toolbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px; border-bottom:1px solid var(--border);
    background:rgba(255,255,255,0.02); flex:0 0 auto; gap:12px;
  }
  .toolbar .doc-name{font-size:13.5px; color:var(--muted);}
  #retryBar{
    display:none; background:rgba(248,113,113,0.12); border-bottom:1px solid rgba(248,113,113,0.35); color:#fca5a5;
    padding:9px 18px; font-size:13.5px; align-items:center; justify-content:space-between; flex:0 0 auto;
  }
  #retryBar .btn{padding:6px 14px; font-size:13px;}

  .split{ flex:1; display:flex; overflow:hidden; }
  .split > div{ flex:1; overflow-y:auto; padding:20px; }
  .split .divider{flex:0 0 1px; background:var(--border);}
  #aiPane h3, #pdfPane h3{font-size:14px; color:var(--muted); font-weight:700; margin-bottom:12px; font-family:'Inter',sans-serif;}
  #aiOut{font-size:15px; line-height:1.7; white-space:pre-wrap; color:var(--text);}
  #aiOut .placeholder{color:var(--muted);}
  #pdfCanvasWrap{position:relative; display:inline-block;}
  #pdfCanvasWrap canvas{max-width:100%; border:1px solid var(--border); border-radius:8px;}
  .hit{ background:rgba(251,191,36,.55) !important; border-radius:2px; }

  /* --- Suzuvchi burchak tugmasi (rasm yuklash) --- */
  #captureFab{
    position:fixed; right:22px; bottom:calc(22px + env(safe-area-inset-bottom,0px));
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent-700),var(--accent)); color:#fff; border:none;
    box-shadow:0 0 22px -2px var(--glow);
    font-size:24px; cursor:pointer; z-index:50;
  }

  /* --- Crop overlay --- */
  #cropOverlay{
    display:none; position:fixed; inset:0; background:rgba(5,4,8,.92); z-index:100;
    flex-direction:column; align-items:center; justify-content:center; padding:20px;
  }
  #cropStage{position:relative; max-width:92vw; max-height:76vh; touch-action:none;}
  #cropStage img{max-width:92vw; max-height:76vh; display:block; user-select:none; border-radius:8px;}
  #cropRect{
    position:absolute; border:2px dashed var(--accent); background:rgba(175,2,232,.15);
    cursor:move; box-shadow:0 0 20px -4px var(--glow);
  }
  .crop-handle{
    position:absolute; width:16px; height:16px; border-radius:50%;
    background:var(--accent); border:2px solid #fff;
    box-shadow:0 0 10px -2px var(--glow);
    transform:translate(-50%,-50%);
  }
  .crop-handle-nw{ top:0; left:0; cursor:nwse-resize; }
  .crop-handle-ne{ top:0; left:100%; cursor:nesw-resize; }
  .crop-handle-sw{ top:100%; left:0; cursor:nesw-resize; }
  .crop-handle-se{ top:100%; left:100%; cursor:nwse-resize; }
  .crop-actions{margin-top:18px; display:flex; gap:12px;}
  .crop-hint{color:#c7cad6; font-size:13px; margin-top:10px; text-align:center;}

  /* --- Owner rejimi animatsion belgisi --- */
  .owner-badge{
    position:fixed; top:14px; left:50%; z-index:200;
    display:flex; align-items:center; gap:9px;
    padding:10px 18px; border-radius:999px;
    background:var(--glass-strong); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid var(--border-accent);
    box-shadow:0 0 26px -4px var(--glow);
    color:#fff; font-size:13.5px; font-weight:600;
    transform:translate(-50%,-140%); opacity:0;
    transition:transform .55s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
    pointer-events:none;
  }
  .owner-badge img{ width:20px; height:20px; color:var(--accent); }
  .owner-badge.show{ transform:translate(-50%,0); opacity:1; }
</style>
</head>
<body>
<div class="glow-sphere-1"></div>
<div class="glow-sphere-2"></div>

<div id="ownerBadge" class="owner-badge">
  <img src="assets/lock-unlocked.svg" alt="">
  <span>Owner rejimi faol</span>
</div>

<header>
  <div class="brand"><div class="mark">A</div><span>Acht</span></div>
  <div class="right">
    <span class="who" id="whoLabel"></span>
    <span class="who" id="aiCounter"></span>
    <span class="who" id="ghLimit"></span>
    <a id="adminLink" class="btn secondary" href="admin.html" style="display:none; padding:7px 14px; font-size:13px;">Owner paneli</a>
    <button class="btn secondary" style="padding:7px 14px; font-size:13px;" onclick="logout()">Chiqish</button>
  </div>
</header>

<!-- 1) Papka va PDF tanlash -->
<div id="pickerScreen">
  <div class="picker-wrap">
    <div class="crumbs" id="crumbs"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- 2) Ish maydoni -->
<div id="workspace">
  <div class="toolbar">
    <span class="doc-name" id="docName"></span>
    <button class="btn secondary" style="padding:7px 14px; font-size:13px;" onclick="backToPicker()">← Boshqa kitob</button>
  </div>
  <div id="retryBar">
    <span id="retryMsg">Javob PDF matniga mos topilmadi.</span>
    <button class="btn gold" onclick="resetForRetry()">Qayta urinish</button>
  </div>
  <div class="split">
    <div id="aiPane">
      <h3>AI javobi</h3>
      <div id="aiOut"><span class="placeholder">Pastdagi (yoki o'ng-pastdagi) tugma orqali savol rasmini yuklang.</span></div>
    </div>
    <div class="divider"></div>
    <div id="pdfPane">
      <h3>Kitob (PDF)</h3>
      <div id="pdfCanvasWrap"></div>
    </div>
  </div>
</div>

<button id="captureFab" title="Rasm olish">📷</button>

<!-- Crop oynasi -->
<div id="cropOverlay">
  <div id="cropStage">
    <img id="cropImg" alt="">
    <div id="cropRect"></div>
  </div>
  <div class="crop-hint">Savol va variantlar joylashgan qismni belgilang, so'ng "Kesib olish"ni bosing.</div>
  <div class="crop-actions">
    <button class="btn secondary" id="cropCancel">Bekor qilish</button>
    <button class="btn gold" id="cropConfirm">Kesib olish</button>
  </div>
</div>

<script src="js/gemini-api-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/github-config.js"></script>
<script src="js/github-upload.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
